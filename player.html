<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flash Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ----------------------- 基础布局 ----------------------- */
        body {
            background-color: #1a1c22;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow: auto;
        }

        /* ----------------------- 响应式容器 ----------------------- */
        #flash-container {
            width: 120vw;
            max-width: 1500px;
            height: 0;
            top: -20%;
            left: -10%;
            padding-bottom: 50%;
            position: relative;
            box-shadow: 0 0 0px rgba(0,0,0,0.5);
        }

        /* ----------------------- 播放器填充容器 ----------------------- */
        #flash-container > ruffle-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 120%;
            height: 120%;
        }

        /* ----------------------- 媒体查询 (针对手机和平板) ----------------------- */
        @media (max-width: 768px) {
            #flash-container {
                width: 95vw;
                padding-bottom: 75%;
            }
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    <div id="flash-container"></div>
    <script>
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("flash-container");
        container.appendChild(player);

        // 从URL参数中获取游戏名称（兼容本地文件协议）
        function getGameFromUrl() {
            // 方法1: 使用 URLSearchParams
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const game = urlParams.get('game');
                if (game) return game;
            } catch (e) {
                console.log('URLSearchParams not supported');
            }

            // 方法2: 手动解析URL参数（兼容性更好）
            const queryString = window.location.search.substring(1);
            const params = queryString.split('&');
            for (let i = 0; i < params.length; i++) {
                const pair = params[i].split('=');
                if (decodeURIComponent(pair[0]) === 'game') {
                    return decodeURIComponent(pair[1] || '');
                }
            }

            // 默认游戏
            return 'game1.swf';
        }

        const gameName = getGameFromUrl();

        // 构建本地游戏文件路径
        const gamePath = `./game/${gameName}`;

        console.log('Loading game:', gamePath);

        // 加载游戏
        player.load(gamePath).catch(err => {
            console.error('Failed to load game:', err);
        });
    </script>
</body>
</html>
